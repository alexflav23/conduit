hypervolt {
  env = "local"
  env = ${?HYPERVOLT_ENV}

  database {
    host = "localhost"
    host = ${?CONDUIT_DB_HOST}
    port = 5532
    port = ${?CONDUIT_DB_PORT}
    database = "conduit"
    database = ${?CONDUIT_DB_DATABASE}
    user = "conduit"
    user = ${?CONDUIT_DB_USER}
    password = "conduit"
    password = ${?CONDUIT_DB_PASSWORD}
  }

  http {
    host = "0.0.0.0"
    host = ${?CONDUIT_HTTP_HOST}
    port = 8080
    port = ${?CONDUIT_HTTP_PORT}
  }

  admin {
    port = 9990
    port = ${?CONDUIT_ADMIN_PORT}
  }

  pulsar {
    service_url = "pulsar://localhost:6650"
    service_url = ${?CONDUIT_PULSAR_URL}
  }

  tigerbeetle {
    cluster = 0
    cluster = ${?CONDUIT_TB_CLUSTER}
    addresses = "127.0.0.1:3033"
    addresses = ${?CONDUIT_TB_ADDRESSES}
  }

  # Xero accounting consumer (doc 13/07 M13). Empty/placeholder client_id => the consumer runs a local no-op
  # (no outbound calls) — so dev/CI never hit Xero. Set the real OAuth2 client-credentials app values in prod.
  xero {
    client_id = ""
    client_id = ${?XERO_CLIENT_ID}
    client_secret = ""
    client_secret = ${?XERO_CLIENT_SECRET}
    identity_url = "https://identity.xero.com"
    identity_url = ${?XERO_IDENTITY_URL}
    api_url = "https://api.xero.com/api.xro/2.0"
    api_url = ${?XERO_API_URL}
    tenant_id = ""
    tenant_id = ${?XERO_TENANT_ID}
    scope = "accounting.transactions accounting.contacts"
    scope = ${?XERO_SCOPE}
  }

  stripe {
    # Endpoint signing secret for the webhook (whsec_...). Empty in dev/CI → signature check is skipped so the
    # webhook can be exercised without a live Stripe; in staging/prod it must be set or every webhook is rejected.
    webhook_secret = ""
    webhook_secret = ${?STRIPE_WEBHOOK_SECRET}
  }

  documents {
    # WORM document bucket (doc 17 §6). endpoint empty → default AWS S3 client (instance role); set it to a
    # LocalStack URL in dev. access_key/secret_key are only used with a custom endpoint.
    bucket     = "conduit-records-local"
    bucket     = ${?CONDUIT_DOCUMENTS_BUCKET}
    endpoint   = ""
    endpoint   = ${?CONDUIT_DOCUMENTS_ENDPOINT}
    access_key = "test"
    access_key = ${?CONDUIT_DOCUMENTS_ACCESS_KEY}
    secret_key = "test"
    secret_key = ${?CONDUIT_DOCUMENTS_SECRET_KEY}
  }

  # Required by the shared EnvironmentConfig.fromConfig (read by both api and consumer). The consumer never
  # verifies Google tokens, but the config parse needs the block present — mirror the api's.
  auth {
    google_client_id = ""
    google_client_id = ${?GOOGLE_OAUTH_CLIENT_ID}
    workspace_domain = "hypervolt.co.uk"
    workspace_domain = ${?GOOGLE_WORKSPACE_DOMAIN}
  }
}
