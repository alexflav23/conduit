# Conduit CI — mirrors the house pattern (nix-shell runners, scalafmt gate, package -> publish).
# Schema-check (Avro BACKWARD) and the no-float money lint are added in M1.
stages:
  - lint
  - test
  - package
  - publish

variables:
  SBT_OPTS: "-Duser.home=$CI_PROJECT_DIR"
  # terraform init pulls the private rbac module from GitLab's module registry; the CI job token authenticates
  # it (the source project must allowlist hypervolt/conduit under CI/CD → Token Access).
  TF_TOKEN_gitlab_com: "${CI_JOB_TOKEN}"

scalafmt:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt 'scalafmtCheck;Test/scalafmtCheck'"

# doc 14 §1.1 no-float gate + doc 03 §2 Avro BACKWARD-compat gate
# + doc 19 §B.1 secretScan + doc 19 §C.6 forward-only migration gate.
financial-gates:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt noFloatCheck schemaCheck secretScan migrationCheck"

# M-Assurance G (doc 29 G): the terraform gate. fmt is offline — it runs on every push, anywhere. The full
# `plan` (init pulls the estate modules over GitLab SSH + assumes the per-env AWS role) runs only on the
# estate-credentialed runner on protected branches; it never gates a feature branch and never needs secrets
# on a fork. A drift or a malformed module is caught before the deploy path, not during it.
terraform-fmt:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    # terraform is unfree in nixpkgs (BSL) — NIXPKGS_ALLOW_UNFREE + --impure to permit it.
    - NIXPKGS_ALLOW_UNFREE=1 nix-shell --impure -p terraform --run "terraform fmt -check -recursive terraform/"

# Enforcing on every pipeline: backend-less init (fetches the private module sources over the estate runner's
# GitLab SSH key — no AWS needed) + validate catches malformed HCL and broken module wiring before the deploy
# path. This is the always-on gate; the credentialed plan below adds drift detection on protected branches.
terraform-validate:
  stage: lint
  tags:
    - x86_64-nix-24.11   # the estate runner carries the GitLab SSH deploy key + module-registry token for sources
  script:
    # TF_WORKSPACE=staging so workspace-keyed locals (per_env, deploy_versions, indexed by terraform.workspace)
    # resolve during validate — validate otherwise runs in `default`, which those maps don't key. roles-global is
    # applied in the `default` workspace, so it validates there. -backend=false keeps it AWS-free (no plan/state).
    # cacert: the nix-built terraform has no CA bundle, so the GitLab module-registry fetch fails TLS verify.
    - NIXPKGS_ALLOW_UNFREE=1 nix-shell --impure -p terraform cacert --run '
        for m in roles-global rds conduit-records conduit-tigerbeetle conduit-api conduit-consumer; do
          echo "== validate $m ==";
          ws=staging; [ "$m" = "roles-global" ] && ws=default;
          (cd terraform/$m && terraform init -backend=false -input=false >/dev/null && TF_WORKSPACE=$ws terraform validate) || exit 1;
        done'

# Enforcing on protected branches (the estate runner holds the <env>-conduit-<component>-operator AWS role).
# A plan failure now BLOCKS the pipeline — infrastructure drift or a bad change is caught before deploy, not
# during it. (Was advisory while the runner creds were being wired; that gap is now closed — doc 29 G.)
terraform-plan:
  stage: lint
  tags:
    - x86_64-nix-24.11
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - NIXPKGS_ALLOW_UNFREE=1 nix-shell --impure -p terraform awscli2 cacert --run '
        for m in roles-global rds conduit-records conduit-tigerbeetle conduit-api conduit-consumer; do
          (cd terraform/$m && terraform init -input=false && terraform validate && terraform plan -input=false -lock=false);
        done'

compile-test:
  stage: test
  tags:
    - x86_64-nix-24.11-dind
  script:
    - nix-shell --run "sbt clean compile test"

package:
  stage: package
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt api/Universal/packageXzTarball consumer/Universal/packageXzTarball"
  artifacts:
    paths:
      - "api/target/universal/*.txz"
      - "consumer/target/universal/*.txz"
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Publish to the pkgs bucket + record nix module versions (protected branches only — the deploy path).
publish:
  stage: publish
  tags:
    - x86_64-nix-24.11
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  dependencies:
    - package
  script:
    - ./scripts/publish ${CI_COMMIT_SHORT_SHA}
