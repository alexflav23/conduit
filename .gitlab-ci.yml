# Conduit CI — mirrors the house pattern (nix-shell runners, scalafmt gate, package -> publish).
# Schema-check (Avro BACKWARD) and the no-float money lint are added in M1.
stages:
  - lint
  - test
  - package
  - publish

variables:
  SBT_OPTS: "-Duser.home=$CI_PROJECT_DIR"

scalafmt:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt 'scalafmtCheck;Test/scalafmtCheck'"

# doc 14 §1.1 no-float gate + doc 03 §2 Avro BACKWARD-compat gate
# + doc 19 §B.1 secretScan + doc 19 §C.6 forward-only migration gate.
financial-gates:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt noFloatCheck schemaCheck secretScan migrationCheck"

compile-test:
  stage: test
  tags:
    - x86_64-nix-24.11-dind
  script:
    - nix-shell --run "sbt clean compile test"

package:
  stage: package
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt api/Universal/packageXzTarball consumer/Universal/packageXzTarball"
  artifacts:
    paths:
      - "api/target/universal/*.txz"
      - "consumer/target/universal/*.txz"
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Publish to the pkgs bucket + record nix module versions (protected branches only — the deploy path).
publish:
  stage: publish
  tags:
    - x86_64-nix-24.11
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  dependencies:
    - package
  script:
    - ./scripts/publish ${CI_COMMIT_SHORT_SHA}
