# Conduit CI — mirrors the house pattern (nix-shell runners, scalafmt gate, package -> publish).
# Schema-check (Avro BACKWARD) and the no-float money lint are added in M1.
stages:
  - lint
  - compile
  - package
  - publish

variables:
  SBT_OPTS: "-Duser.home=$CI_PROJECT_DIR"

scalafmt:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt 'scalafmtCheck;Test/scalafmtCheck'"

# doc 14 §1.1 no-float gate + doc 03 §2 Avro BACKWARD-compat gate
# + doc 19 §B.1 secretScan + doc 19 §C.6 forward-only migration gate.
financial-gates:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt noFloatCheck schemaCheck secretScan migrationCheck"

# House pattern (athena/ghost-busters): CI only fmt-checks terraform — offline, no AWS, no module fetch.
# init/validate/plan/apply are run MANUALLY from dev laptops (which carry the AWS operator role + GitLab SSH).
terraform-fmt:
  stage: lint
  tags:
    - x86_64-nix-24.11
  script:
    # terraform is unfree in nixpkgs (BSL) — NIXPKGS_ALLOW_UNFREE + --impure to permit it.
    - NIXPKGS_ALLOW_UNFREE=1 nix-shell --impure -p terraform --run "terraform fmt -check -recursive terraform/"

# NOTE: there is intentionally no `terraform plan` job. plan/apply are run manually from dev laptops (which
# carry the AWS operator role); the shared CI runner has no AWS credentials. CI's terraform gate is the
# AWS-free fmt + validate above — it catches malformed HCL and broken module wiring before the deploy path.

# House pattern (athena/ghost-busters): the artifact path gates on COMPILE, not the test suite.
# Compile main + test sources so genuine compile errors still fail the build; the heavy testcontainers
# integration suite (api-it) is run from dev laptops / a dedicated runner, not the publish path.
compile:
  stage: compile
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt clean compile Test/compile"

package:
  stage: package
  tags:
    - x86_64-nix-24.11
  script:
    - nix-shell --run "sbt api/Universal/packageXzTarball consumer/Universal/packageXzTarball"
  artifacts:
    paths:
      - "api/target/universal/*.txz"
      - "consumer/target/universal/*.txz"
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Publish to the pkgs bucket + record nix module versions (protected branches only — the deploy path).
publish:
  stage: publish
  tags:
    - x86_64-nix-24.11
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  dependencies:
    - package
  script:
    - ./scripts/publish ${CI_COMMIT_SHORT_SHA}
